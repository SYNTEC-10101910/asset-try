<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資產盤點系統 v4.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        #login-section { margin: 20px 0; }
        input { width: 80%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #asset-list-section { display: none; margin-top: 20px; text-align: left; }
        
        .asset-item { padding: 15px 0; border-bottom: 1px solid #eee; }
        .asset-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        /* 各種狀態標籤的樣式 */
        .status-done { color: #28a745; font-weight: bold; }
        .status-change { color: #ffc107; font-weight: bold; }
        .status-scrap { color: #dc3545; font-weight: bold; }
        .status-pending { color: #6c757d; font-weight: bold; }
        
        /* 操作按鈕群組 */
        .action-btns { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: white; }
        .btn-manual { background: #17a2b8; }
        .btn-change { background: #ffc107; color: #333; }
        .btn-scrap { background: #dc3545; }
        
        #reader { width: 100%; margin-top: 20px; display: none; border-radius: 10px; overflow: hidden; background-color: #000; }
        #reader__camera_selection { display: none !important; } /* 隱藏多餘的鏡頭下拉選單 */
        #result { margin-top: 15px; font-weight: bold; color: #007bff; min-height: 20px; }
        .btn-green { background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; width: 100%; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>資產盤點系統</h2>

    <div id="login-section">
        <p>請輸入保管人工號</p>
        <input type="text" id="empId" placeholder="例如: 10109999">
        <br>
        <button class="btn-blue" onclick="fetchAssets()">查詢資產清單</button>
    </div>

    <div id="asset-list-section">
        <h3>您的待盤點清單</h3>
        <div id="list-content"></div>
        <button class="btn-green" id="start-btn" onclick="startScanner()">📷 開始掃描 QR Code 盤點</button>
    </div>

    <div id="reader"></div> 
    <div id="result"></div>
</div>

<script>
    // ⚠️ 這裡請填入您最新的 GAS 部署網址
    // const scriptUrl = 'https://script.google.com/macros/s/AKfycbyRIIunShCGbXyBKpWEuAFIEuOe8G2Sa1LULKoM_hqRLPmpIo3oMqZOPt3miGQ5cFCFUQ/exec'; 
    // 上面網址為芷瑩google表單舊址，下面為公司IT帳號所建google表單
    const scriptUrl = 'https://script.google.com/macros/s/AKfycby-DQ9qDYtk1giavcy2CTSAS1lN3eO-FLHcrdoTsjGJIhyiKBrvmzVz88rh3PsC_62YcA/exec'; 

    let html5QrcodeScanner;

    function fetchAssets() {
        const empId = document.getElementById('empId').value.trim();
        if (!empId) { alert("請輸入工號！"); return; }
        document.getElementById('list-content').innerHTML = "載入中...";
        
        fetch(`${scriptUrl}?empId=${empId}`)
        .then(res => res.json())
        .then(data => {
            const listSection = document.getElementById('asset-list-section');
            const listContent = document.getElementById('list-content');
            listContent.innerHTML = "";
            
            if (data.length === 0) {
                listContent.innerHTML = "<p style='color:red'>查無資產，請確認工號。</p>";
            } else {
                data.forEach(item => {
                    const status = item.status ? item.status.trim() : "";
                    
                    // 判斷是否已經處理過（已盤點 / 目視盤點 / 需異動 / 需報廢）
                    const isProcessed = ["已盤點", "目視盤點", "需異動", "需報廢"].includes(status);
                    const locationText = item.location ? item.location : "未填寫";

                    // 依狀態決定顯示標籤的文字與顏色
                    let statusHtml = "";
                    if (status === "已盤點" || status === "目視盤點") {
                        statusHtml = `<span class="status-done">✅ ${status}</span>`;
                    } else if (status === "需異動") {
                        statusHtml = `<span class="status-change">⚠️ 需異動</span>`;
                    } else if (status === "需報廢") {
                        statusHtml = `<span class="status-scrap">❌ 需報廢</span>`;
                    } else {
                        statusHtml = `<span class="status-pending">⭕ 未盤點</span>`;
                    }

                    // 組合 HTML：若已處理則只顯示狀態標籤，不再顯示操作按鈕
                    listContent.innerHTML += `
                        <div class="asset-item">
                            <div class="asset-header">
                                <div style="flex:1; padding-right: 10px;">
                                    <strong>${item.id}</strong><br>
                                    <span style="font-size: 14px; color:#333;">${item.name}</span><br>
                                    <small style="color:#888;">📍 地點: ${locationText}</small>
                                </div>
                                <div style="text-align:right;">
                                    ${statusHtml}
                                </div>
                            </div>
                            
                            ${!isProcessed ? `
                            <div class="action-btns">
                                <button class="btn-action btn-manual" onclick="processAsset('${item.id}', 'manual')">目視盤點</button>
                                <button class="btn-action btn-change" onclick="processAsset('${item.id}', 'change')">異動</button>
                                <button class="btn-action btn-scrap" onclick="processAsset('${item.id}', 'scrap')">報廢</button>
                            </div>
                            ` : ''}
                        </div>`;
                });
            }
            listSection.style.display = "block";
        })
        .catch(err => alert("無法連線系統，請確認 HTTPS 與網路。"));
    }

    // 處理各種單項點擊操作 (目視 / 異動 / 報廢)
    function processAsset(assetId, type) {
        let confirmMsg = "";
        if (type === "manual") confirmMsg = `確認資產 [${assetId}] 已經由目視確認無誤（目視盤點）？`;
        if (type === "change") confirmMsg = `確認資產 [${assetId}] 需要申請「異動」？`;
        if (type === "scrap") confirmMsg = `確認資產 [${assetId}] 需要申請「報廢」？`;

        if (confirm(confirmMsg)) {
            sendDataToGas(assetId, type);
        }
    }

    function startScanner() {
        const readerDiv = document.getElementById('reader');
        readerDiv.style.display = "block"; 
        document.getElementById('start-btn').style.display = "none";
        
        const config = { 
            fps: 25, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
            videoConstraints: { 
                facingMode: { exact: "environment" } 
            }
        };

        html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);

        html5QrcodeScanner.render(
            (text) => sendDataToGas(text, "scan"),
            (err) => {}
        );
    }

    function sendDataToGas(content, type) {
        document.getElementById('result').innerText = "處理中...";
        
        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ url: content, type: type })
        })
        .then(() => {
            let msg = "操作成功！";
            if (type === "scan") msg = "掃描盤點成功！";
            if (type === "manual") msg = "目視盤點成功！";
            if (type === "change") msg = "標記需異動成功！";
            if (type === "scrap") msg = "標記需報廢成功！";

            document.getElementById('result').innerText = msg;
            
            if (type === "scan" && html5QrcodeScanner) {
                html5QrcodeScanner.clear(); 
                document.getElementById('reader').style.display = "none";
                document.getElementById('start-btn').style.display = "block";
            }
            setTimeout(() => {
                fetchAssets(); // 重新整理清單
                document.getElementById('result').innerText = "";
            }, 1000);
        })
        .catch(err => {
            document.getElementById('result').innerText = "連線失敗。";
        });
    }
</script>

</body>
</html>
